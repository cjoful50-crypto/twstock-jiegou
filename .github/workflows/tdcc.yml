name: 集保大戶散戶（每週）
on:
  schedule:
    - cron: '17 2 * * 6'   # 台北週六 10:17，集保週五晚間公布
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tdcc.js
      - name: 存檔
        run: |
          git config user.name "twstock-bot"
          git config user.email "twstock-bot@users.noreply.github.com"
          git add data/tdcc
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "集保資料 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
