name: 每日名單與成績單
on:
  schedule:
    - cron: '7 4 * * 1-5'    # 台北 12:07 先啟動，等到 16:45 收盤資料公布後才執行（GitHub 排程常延遲數小時，提早啟動才能準時）
    - cron: '50 8 * * 1-5'   # 台北 16:50，備援
    - cron: '30 11 * * 1-5'  # 台北 19:30 補跑一次，以防法人資料延遲
  workflow_dispatch:
    inputs:
      backfill:
        description: '回補幾個交易日'
        default: '60'
      rescreen:
        description: '用目前規則重算所有歷史名單（true/false）'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 等到收盤資料公布（台北 16:45）
        if: github.event_name == 'schedule'
        run: |
          node -e "const now=new Date(Date.now()+8*3600e3), m=now.getUTCHours()*60+now.getUTCMinutes(), w=16*60+45-m; if (w>0) { console.log('等待', w, '分鐘'); setTimeout(()=>{}, w*60e3); } else console.log('已過 16:45，直接執行');"
      - run: node scripts/build.js
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '60' }}
          RESCREEN: ${{ github.event.inputs.rescreen == 'true' && '1' || '' }}
      - name: 存檔
        run: |
          git config user.name "twstock-bot"
          git config user.email "twstock-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "每日名單 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
