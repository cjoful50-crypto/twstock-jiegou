<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="輸入台股代號，整理漲停指數、結構支撐壓力與法人籌碼。">
<title>盤後結構室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap">
<style>
/* 版面：單欄研究卡，桌機時價位地圖與結構說明左右並排；所有數字用等寬字 */
:root{
  --bg:#eef0f6; --surface:#ffffff; --sunk:#f5f6fb; --ink:#161a2c; --muted:#5b6079; --faint:#8b90a8; --line:#dde0ea;
  --accent:#4436c9; --accent-soft:#e8e6ff; --up:#cf2f43; --up-soft:#fde8eb; --down:#0f8a5c; --down-soft:#e2f5ec; --warn:#a8670c; --warn-soft:#fdf1dc;
  --res:#c2410c; --sup:#4436c9;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#161a2d; --sunk:#1c2137; --ink:#e8e9f4; --muted:#a2a7c2; --faint:#757b98; --line:#2a2f48;
  --accent:#958cff; --accent-soft:#272457; --up:#ff6b7c; --up-soft:#3a1d27; --down:#3fcf93; --down-soft:#14322a; --warn:#f1b24a; --warn-soft:#3a2c13;
  --res:#ff9a5c; --sup:#958cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2d; --sunk:#1c2137; --ink:#e8e9f4; --muted:#a2a7c2; --faint:#757b98; --line:#2a2f48;
  --accent:#958cff; --accent-soft:#272457; --up:#ff6b7c; --up-soft:#3a1d27; --down:#3fcf93; --down-soft:#14322a; --warn:#f1b24a; --warn-soft:#3a2c13;
  --res:#ff9a5c; --sup:#958cff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;display:grid;gap:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h2{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0;text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 頂欄 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 4px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.brand span{font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700}
:root[data-theme="dark"] .btn{color:#0e1120}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0e1120}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* 主卡 */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.hero .id{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hero .code{font-family:var(--f-num);color:var(--accent);font-weight:600}
.hero .name{font-family:var(--f-display);font-size:1.7rem;font-weight:800}
.price{display:flex;align-items:baseline;gap:12px;margin-top:4px;flex-wrap:wrap}
.price .px{font-size:3rem;font-weight:600;line-height:1.1}
.price .ch{font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;border:1px solid currentColor}
.pill.risk{color:var(--up);background:var(--up-soft)} .pill.bear{color:var(--warn);background:var(--warn-soft)} .pill.flat{color:var(--muted);background:var(--sunk)} .pill.bull{color:var(--down);background:var(--down-soft)}
.dates{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--faint);font-size:.75rem;margin-top:14px}
.gauge{display:grid;justify-items:center;gap:8px;min-width:170px}
.gauge svg{width:150px;height:150px}
.dims{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.dim .lab{font-size:.78rem;color:var(--muted)}
.dim .val{font-size:1.05rem;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:3px}

/* 價位地圖 */
.map{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:start}
.ladder svg{width:100%;height:auto;display:block}
.zone-state{font-family:var(--f-display);font-size:1.2rem;font-weight:800;margin:6px 0}
.muted{color:var(--muted)} .small{font-size:.82rem}
.pos{margin-top:18px}
.pos .track{position:relative;display:grid;grid-template-columns:35fr 35fr 30fr;height:14px;border-radius:7px;overflow:hidden;margin:26px 0 6px}
.pos .track span:nth-child(1){background:var(--accent-soft)} .pos .track span:nth-child(2){background:var(--warn-soft)} .pos .track span:nth-child(3){background:var(--up-soft)}
.pos .marker{position:absolute;top:-24px;transform:translateX(-50%);font-size:.75rem;font-weight:700;white-space:nowrap}
.pos .marker::after{content:"";display:block;width:2px;height:30px;background:var(--ink);margin:2px auto 0}
.pos .legend{display:grid;grid-template-columns:35fr 35fr 30fr;font-size:.75rem;color:var(--muted)}
.pos .legend span:last-child{text-align:right}

.points{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.points li{padding-left:18px;position:relative}
.points li::before{content:"";position:absolute;left:2px;top:.65em;width:7px;height:7px;border-radius:2px;background:var(--accent)}

.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.why div{background:var(--sunk);border-radius:10px;padding:12px 14px}
.why b{display:block;font-size:.95rem}

.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.lv{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.lv.sup{border-top:3px solid var(--sup)} .lv.res{border-top:3px solid var(--res)}
.lv .row{display:grid;gap:2px}
.lv .row+.row{border-top:1px dashed var(--line);padding-top:10px}
.lv .p{font-size:1.5rem;font-weight:600}
.lv .tag{font-size:.75rem;color:var(--muted)}
.sigs{display:flex;flex-wrap:wrap;gap:4px}
.sigs span{font-size:.72rem;background:var(--sunk);border-radius:6px;padding:1px 7px;color:var(--muted)}
.str{font-size:.75rem;font-weight:700}
.str.s4{color:var(--up)} .str.s3{color:var(--res)} .str.s2{color:var(--warn)} .str.s1{color:var(--muted)}
details.rules{margin-top:12px;font-size:.82rem;color:var(--muted)}
details.rules summary{cursor:pointer;color:var(--accent);font-weight:700}

/* 研究室 */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:12px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.panel{padding-top:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:.78rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.kv div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:.75rem;color:var(--muted)}
.kv b{font-size:1.1rem}
.chart svg{width:100%;height:auto;display:block}
.score-dim{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.score-dim header{display:flex;justify-content:space-between;font-weight:700}
.score-dim li{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted)}
.score-dim ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}

/* 換一檔 */
.picks-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.pcol{display:grid;gap:8px;align-content:start}
.pcol>h3{margin:0;font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline}
.pcol>h3 small{font-weight:400;color:var(--faint);font-size:.72rem}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.pick:hover{border-color:var(--accent)}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick .top1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pick .nm{font-weight:700}
.pick .lv{display:flex;gap:12px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.empty{font-size:.85rem;color:var(--faint);border:1px dashed var(--line);border-radius:12px;padding:12px}
@media (max-width:720px){.picks-grid{grid-template-columns:1fr}}
.search{display:flex;gap:8px;flex:1 1 260px;max-width:420px}
.search input{flex:1;min-width:0;font:inherit;font-family:var(--f-num);font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.loading{display:grid;gap:10px;justify-items:start}
.loading .dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;opacity:.3}
@media (prefers-reduced-motion:no-preference){.loading .dots span{animation:blink 1.2s infinite}.loading .dots span:nth-child(2){animation-delay:.2s}.loading .dots span:nth-child(3){animation-delay:.4s}}
@keyframes blink{50%{opacity:1}}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
legend{font-size:.82rem;font-weight:700;padding:0 6px}
.err{color:var(--up);font-weight:700}
.note{font-size:.78rem;color:var(--faint);line-height:1.7}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .gauge{justify-self:start;grid-template-columns:auto auto;align-items:center;justify-items:start}
  .gauge svg{width:110px;height:110px}
  .map{grid-template-columns:1fr}
  .ladder{max-width:340px}
  .why,.levels{grid-template-columns:1fr}
  .dims{grid-template-columns:repeat(3,1fr)}
  .price .px{font-size:2.4rem}
}
@media (prefers-reduced-motion:no-preference){ .ring{transition:stroke-dashoffset .8s ease} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>盤後結構室</b><span>收盤資料・結構價位・五面向評分</span></div>
    <form class="search" id="searchForm" role="search">
      <input id="q" name="q" inputmode="numeric" autocomplete="off" placeholder="輸入股票代號，例如 2330" aria-label="股票代號" maxlength="6">
      <button class="btn" type="submit">查詢</button>
    </form>
    <div class="chips" id="saved" aria-label="最近查詢" style="flex-basis:100%"></div>
  </header>

  <section class="card" id="picks" aria-labelledby="picksTitle"></section>

  <main id="app" style="display:grid;gap:18px"></main>

  <footer class="note">本站為資料整理與研究工具，不構成投資建議。資料來自臺灣證券交易所、證券櫃檯買賣中心與公開資訊觀測站的公開資料，為最近交易日收盤後資料，非即時報價；上櫃股票目前只有行情與量價，沒有法人、籌碼與基本面。評分與價位邏輯為自行實作，僅供參考。</footer>
</div>

<script src="/engine.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fx = (x, d = 2) => x == null || isNaN(x) ? '—' : (+x).toFixed(d);
const fi = x => x == null ? '—' : Math.round(x).toLocaleString('en-US');
const sg = (x, d = 2) => x == null ? '—' : (x > 0 ? '+' : '') + (+x).toFixed(d);
const sgi = x => x == null ? '—' : (x > 0 ? '+' : '') + fi(x);
const cls = x => x > 0 ? 'up' : x < 0 ? 'down' : '';
const pxd = p => p >= 100 ? (Number.isInteger(p) ? p.toFixed(2) : p.toFixed(2)) : p.toFixed(2);

let recent = [];
try { recent = JSON.parse(localStorage.getItem('jiegou-recent') || '[]') || []; } catch (e) { recent = []; }
let current = null;
const remember = (code, name) => { recent = [{ code, name }, ...recent.filter(r => r.code !== code)].slice(0, 8); try { localStorage.setItem('jiegou-recent', JSON.stringify(recent)); } catch (e) {} };
function renderChips() {
  $('#saved').innerHTML = recent.map(s => `<button class="chip" type="button" data-code="${esc(s.code)}" aria-pressed="${s.code === current}">${esc(s.code)} ${esc(s.name || '')}</button>`).join('');
  $('#saved').querySelectorAll('.chip').forEach(b => b.onclick = () => load(b.dataset.code));
}
const memo = {};
async function load(code) {
  code = String(code || '').trim().toUpperCase();
  if (!code) return;
  current = code; $('#q').value = code;
  if (location.hash !== '#' + code) history.replaceState(null, '', '#' + code);
  renderChips();
  if (memo[code]) { render(memo[code]); return; }
  $('#app').innerHTML = `<section class="card loading"><div class="dots"><span></span><span></span><span></span></div><b>正在向證交所整理 ${esc(code)}</b><span class="small muted">抓近 7 個月日K、三大法人、融資融券、借券賣出、本益比與月營收，第一次查詢約需 5～15 秒。</span></section>`;
  try {
    const r = await fetch('/api/stock?code=' + encodeURIComponent(code));
    const j = await r.json().catch(() => ({ error: '伺服器回應格式錯誤。' }));
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    if (current !== code) return;
    memo[code] = j; remember(code, j.name); renderChips(); render(j);
  } catch (e) {
    if (current !== code) return;
    $('#app').innerHTML = `<section class="card"><p class="err">${esc(e.message)}</p><button class="btn ghost" type="button" id="retry">再試一次</button></section>`;
    $('#retry').onclick = () => load(code);
  }
}

const trendCls = t => ({ 風險: 'risk', 偏空: 'bear', 整理: 'flat', 偏多: 'bull', 多頭: 'bull' }[t]);
const legacyCls = t => ({ 偏空: 'bear', 中性: 'flat', 偏多: 'bull' }[t]);
const scoreColor = s => s == null ? 'var(--faint)' : s >= 60 ? 'var(--down)' : s >= 40 ? 'var(--warn)' : 'var(--up)';

function ring(score) {
  const R = 62, C = 2 * Math.PI * R, off = C * (1 - score / 100);
  return `<svg viewBox="0 0 150 150" role="img" aria-label="漲停指數 ${score} 分">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="12"/>
    <circle class="ring" cx="75" cy="75" r="${R}" fill="none" stroke="${scoreColor(score)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 75 75)"/>
    <text x="75" y="62" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--f-body)">漲停指數</text>
    <text x="75" y="98" text-anchor="middle" font-size="40" font-weight="600" fill="var(--ink)" font-family="var(--f-num)">${score}</text>
  </svg>`;
}

function ladder(a) {
  const c = a.stock.bars.at(-1).c, S = a.st.sup, Rr = a.st.res;
  const pts = [c, ...S.flatMap(b => [b.lo, b.level]), ...Rr.flatMap(b => [b.level, b.hi])];
  if (a.st.limitRef) pts.push(a.st.limitRef);
  const lo = Math.min(...pts), hi = Math.max(...pts), pad = (hi - lo) * .12 || c * .02;
  const H = 300, top = 16, bot = H - 16, y = p => top + (hi + pad - p) / ((hi + pad) - (lo - pad)) * (bot - top);
  let g = `<line x1="88" x2="88" y1="${top}" y2="${bot}" stroke="var(--line)" stroke-width="2"/>`;
  if (a.zone) g += `<rect x="70" y="${y(a.zone.hi)}" width="36" height="${Math.max(4, y(a.zone.lo) - y(a.zone.hi))}" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="3 3"/>`;
  const mark = (p, label, color, band) => {
    let s = '';
    if (band && band[0] !== band[1]) s += `<rect x="80" y="${y(band[1])}" width="16" height="${Math.max(3, y(band[0]) - y(band[1]))}" rx="3" fill="${color}" opacity=".25"/>`;
    return s + `<line x1="74" x2="102" y1="${y(p)}" y2="${y(p)}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="${y(p) + 4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--f-body)">${label}</text>
      <text x="112" y="${y(p) + 5}" font-size="14" font-weight="600" fill="${color}" font-family="var(--f-num)">${pxd(p)}</text>`;
  };
  Rr.forEach((b, i) => g += mark(b.level, i ? '第二壓力' : '第一壓力', 'var(--res)', [b.level, b.hi]));
  if (a.st.limitRef) g += mark(a.st.limitRef, '漲停參考', 'var(--res)');
  S.forEach((b, i) => g += mark(b.level, i ? '第二支撐' : '近端支撐', 'var(--sup)', [b.lo, b.level]));
  g += `<circle cx="88" cy="${y(c)}" r="7" fill="var(--ink)"/><text x="64" y="${y(c) + 4}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">現在</text>
    <text x="112" y="${y(c) + 5}" font-size="15" font-weight="700" fill="var(--ink)" font-family="var(--f-num)">${pxd(c)}</text>`;
  return `<svg viewBox="0 0 220 ${H}" role="img" aria-label="價位地圖">${g}</svg>`;
}

function candles(a) {
  const B = a.stock.bars.slice(-90), n = B.length, ind = a.ind, off = a.stock.bars.length - n;
  const W = 760, H = 330, pl = 8, pr = 58, pt = 12, ph = 230, vt = 258, vh = 60;
  const lines = [...a.st.sup.map(b => ['sup', b.level]), ...a.st.res.map(b => ['res', b.level])];
  const ma20 = ind.ma20.slice(-n), ma60 = ind.ma60.slice(-n);
  const all = [...B.flatMap(b => [b.h, b.l]), ...lines.map(l => l[1])];
  const lo = Math.min(...all), hi = Math.max(...all), py = p => pt + (hi - p) / (hi - lo) * ph;
  const vmax = Math.max(...B.map(b => b.v)), cw = (W - pl - pr) / n, x = i => pl + cw * (i + .5);
  let g = '';
  for (let k = 0; k <= 4; k++) { const p = lo + (hi - lo) * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${py(p)}" y2="${py(p)}" stroke="var(--line)" stroke-width="1"/><text x="${W - pr + 6}" y="${py(p) + 4}" font-size="11" fill="var(--faint)" font-family="var(--f-num)">${p.toFixed(1)}</text>`; }
  B.forEach((b, i) => {
    const prev = i ? B[i - 1].c : a.stock.bars[off - 1]?.c ?? b.o, col = b.c > b.o || (b.c === b.o && b.c >= prev) ? 'var(--up)' : 'var(--down)';
    const y1 = py(Math.max(b.o, b.c)), y2 = py(Math.min(b.o, b.c));
    g += `<line x1="${x(i)}" x2="${x(i)}" y1="${py(b.h)}" y2="${py(b.l)}" stroke="${col}" stroke-width="1"/><rect x="${x(i) - cw * .35}" y="${y1}" width="${cw * .7}" height="${Math.max(1, y2 - y1)}" fill="${col}"/>`;
    g += `<rect x="${x(i) - cw * .35}" y="${vt + vh - b.v / vmax * vh}" width="${cw * .7}" height="${b.v / vmax * vh}" fill="${col}" opacity=".45"/>`;
  });
  const path = arr => arr.map((v, i) => v == null ? '' : `${arr.slice(0, i).some(z => z != null) ? 'L' : 'M'}${x(i).toFixed(1)},${py(v).toFixed(1)}`).join('');
  g += `<path d="${path(ma20)}" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="${path(ma60)}" fill="none" stroke="var(--warn)" stroke-width="1.6"/>`;
  lines.forEach(([t, p]) => g += `<line x1="${pl}" x2="${W - pr}" y1="${py(p)}" y2="${py(p)}" stroke="var(--${t})" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="${W - pr + 2}" y="${py(p) - 9}" width="54" height="18" rx="4" fill="var(--${t})"/><text x="${W - pr + 29}" y="${py(p) + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--surface)" font-family="var(--f-num)">${p.toFixed(1)}</text>`);
  g += `<text x="${pl}" y="${vt - 4}" font-size="11" fill="var(--faint)" font-family="var(--f-body)">成交量（張）</text>`;
  g += `<text x="${pl + 4}" y="${pt + 12}" font-size="11" fill="var(--accent)" font-family="var(--f-body)">— MA20</text><text x="${pl + 64}" y="${pt + 12}" font-size="11" fill="var(--warn)" font-family="var(--f-body)">— MA60</text>`;
  g += `<text x="${pl}" y="${H - 2}" font-size="11" fill="var(--faint)" font-family="var(--f-num)">${B[0].d}</text><text x="${W - pr}" y="${H - 2}" text-anchor="end" font-size="11" fill="var(--faint)" font-family="var(--f-num)">${B.at(-1).d}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 90 日 K 線與結構價位">${g}</svg>`;
}

function levelCard(kind, title, bands, emptyMsg, a) {
  const c = a.stock.bars.at(-1).c;
  const rows = bands.length ? bands.map((b, i) => `<div class="row">
      <span class="tag">${kind === 'sup' ? (i ? '第二支撐' : '近端支撐') : title}｜${b.tier}</span>
      <span class="p num" style="color:var(--${kind})">${pxd(b.level)}</span>
      <span class="small muted num">${b.lo !== b.hi ? '價格帶 ' + pxd(b.lo) + '–' + pxd(b.hi) + '　' : ''}距現價 ${sg((b.level / c - 1) * 100, 1)}%</span>
      <span class="str s${b.rank}">強度：${b.strength}（${b.cats.length} 類 ${b.labels.length} 個訊號）</span>
      <div class="sigs">${b.labels.map(l => `<span>${esc(l)}</span>`).join('')}</div></div>`).join('') : `<div class="row"><span class="tag">${title}</span><span class="p num muted">尚未形成</span><span class="small muted">${emptyMsg}</span></div>`;
  return `<div class="lv ${kind}"><b>${kind === 'sup' ? '支撐觀察' : title}</b>${rows}</div>`;
}

    },

    score: () => `<p class="small muted" style="margin-top:0">漲停指數 = 五面向加權平均（趨勢 25%、量價 20%、法人 20%、籌碼 15%、基本面 20%；缺資料的面向不計，權重重新分配）＋ 風險折減。趨勢、量價、法人、籌碼從 50 分起算，基本面從 40 分起算，各自加減後限制在 0～100。</p>
      ${a.dims.map(x => `<div class="score-dim"><header><span>${x.name}（權重 ${x.w * 100}%）</span><span class="num" style="color:${scoreColor(x.s)}">${x.s ?? '資料不足'}</span></header><ul>${x.items.map(i => `<li><span>${esc(i.label)}</span><span class="num ${cls(i.pts)}">${sgi(i.pts)}</span></li>`).join('') || '<li><span>沒有資料</span></li>'}</ul></div>`).join('')}

      <p class="small muted">加權原始分 ${fx(a.raw, 1)}，即舊版綜合評等（60 以上偏多、38～60 中性、38 以下偏空）；扣掉風險折減後為漲停指數 ${a.index}。走勢標籤看趨勢面分數：70 以上多頭、55 偏多、42 整理、30 偏空、30 以下風險。</p>`
  };
  const showTab = () => { $('#panel').innerHTML = panels[tab](); document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab)); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; showTab(); });
  showTab();
}

  try {
    const r = await fetch('/api/picks'); const j = await r.json().catch(() => ({ error: '伺服器回應格式錯誤。' }));
    if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
    const col = (title, sub, list, n) => `<div class="pcol"><h3>${title}<small>${sub}・符合 ${n} 檔</small></h3>${list.length ? list.map(x => `<button class="pick" type="button" data-code="${esc(x.code)}">
      <div class="top1"><span><span class="code num" style="color:var(--accent)">${esc(x.code)}</span> <span class="nm">${esc(x.name)}</span></span><span class="num ${cls(x.chg)}">${pxd(x.close)} ${sg(x.chg)}%</span></div>
      <div class="sigs">${x.why.map(w => `<span>${esc(w)}</span>`).join('')}</div>
      <div class="lv num"><span>漲停指數 <b style="color:${scoreColor(x.index)}">${x.index ?? '—'}</b></span><span>支撐 <b style="color:var(--sup)">${x.sup != null ? pxd(x.sup) : '—'}</b></span><span>壓力 <b style="color:var(--res)">${x.res != null ? pxd(x.res) : '—'}</b></span></div></button>`).join('') : '<div class="empty">今天沒有股票符合條件。</div>'}</div>`;
    box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2 id="picksTitle">今日篩選名單</h2><span class="small muted num">${esc(j.date)} 收盤・掃描 ${j.universe} 檔上市股票</span></div>
      <p class="small muted" style="margin:6px 0 0">依下方規則從上市股票篩選後排名，是觀察名單，不是買進建議。點任一檔看完整分析。</p>
      <div class="picks-grid">${col('當沖觀察', '量大、振幅大、收高', j.day, j.counts.day)}${col('短期觀察', '數日至數週', j.swing, j.counts.swing)}${col('長期觀察', '營收成長與估值', j.long, j.counts.long)}</div>
      <details class="rules"><summary>名單怎麼選出來的</summary>
        <p>共同條件：一般上市股票（排除 ETF、權證），股價 10 元以上，近 20 日平均成交量 1,000 張以上。同一檔只會出現在一個名單。</p>
        <p><b>當沖觀察</b>：日均成交值 5 億以上、近 14 日平均振幅 3% 以上、當日量比 1.5 倍以上、漲幅 2%～9.5% 且未鎖漲停、收盤位於當日高低區間 70% 以上、站上 MA5。依量比、振幅、收盤位置與漲幅加權排名。</p>
        <p><b>短期觀察</b>：MA5 &gt; MA10 &gt; MA20 且 MA20 上彎、RSI 55～78、近 20 日漲幅 3%～30%（不追過熱）、量比 1 倍以上、三大法人近 5 日合計買超、股價距 60 日高點 8% 以內。依法人買超占日均量比例、RSI、量比與投信是否同步買超排名。</p>
        <p><b>長期觀察</b>：最新月營收年增 15% 以上、本益比 0～25 倍、殖利率 1.5% 以上、收盤站上季線且月線在季線之上。依營收成長、本益比、殖利率與法人動向排名。</p>
        <p>資料為證交所盤後公開資料。法人資料約下午 3 點後公布，盤後早些時候查看時法人條件可能用前一日資料。</p>
      </details>`;
    box.querySelectorAll('.pick').forEach(b => b.onclick = () => { load(b.dataset.code); document.getElementById('app').scrollIntoView({ behavior: 'smooth' }); });
  } catch (e) {
    box.innerHTML = `<h2 id="picksTitle">今日篩選名單</h2><p class="err">${esc(e.message)}</p><button class="btn ghost" type="button" id="retryPicks">再試一次</button>`;
    $('#retryPicks').onclick = loadPicks;
  }
}
loadPicks();
load(location.hash.slice(1) || (recent[0] && recent[0].code) || '2303');
</script>
</body>
</html>
