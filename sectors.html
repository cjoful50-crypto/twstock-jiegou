<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>產業分類｜盤後結構室</title>
<meta name="description" content="依產業瀏覽上市櫃股票的收盤價、漲跌與成交量。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="nav" id="nav" data-page="sectors"></header>
<div class="wrap">
  <div class="page-head"><h1>產業分類</h1><p>依產業查看上市櫃股票最近一個交易日的漲跌、成交量與類股強弱。</p></div>
  <section class="card" aria-labelledby="heatT"><h2 id="heatT">類股強弱</h2><p class="small muted" style="margin:4px 0 10px">各產業依成交值加權計算的平均漲跌，可快速比較資金流向。</p><div id="heatAll"><p class="small muted">載入中…</p></div></section>

  <section class="card" id="browse" aria-labelledby="browseTitle">
    <div class="section-head"><h2 id="browseTitle">股票列表</h2><span class="small muted" id="browseDate"></span></div>
    <p class="small muted" style="margin:4px 0 0">選擇產業以查看個股。點選股票名稱進入分析頁，點選 ☆ 加入我的選股。</p>
    <div class="sector-tabs" id="sectorTabs" role="tablist" aria-label="產業類別"></div>
    <div class="sort-row" id="sortRow"></div>
    <div class="scroll" id="sectorTable"><div class="loading" style="margin-top:10px"><div class="dots"><span></span><span></span><span></span></div><span class="small muted">載入股票清單…</span></div></div>
  </section>

  <footer class="note">本站內容為公開資料的整理與統計，不構成任何投資建議，投資前請自行判斷並承擔風險。資料來源：臺灣證券交易所、證券櫃檯買賣中心、公開資訊觀測站。收盤資料於交易日盤後更新，盤中價格約有數秒延遲。</footer>
</div>
<script src="/common.js"></script>
<script src="/pages.js"></script>
